<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}PET{% endblock %} · Private Encryption Tool</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='pet.css') }}">
</head>
<body>
    <header class="topbar">
        <a class="wordmark" href="{{ url_for('index') }}"><span class="wordmark-mark">P</span><span>PET</span></a>
        {% if current_user %}
        <div class="topbar-user">
            <span class="status-dot"></span>
            <span>{{ current_user.username }}</span>
            <form method="post" action="{{ url_for('logout') }}">
                <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
                <button class="button button-quiet" type="submit">Sign out</button>
            </form>
        </div>
        {% endif %}
    </header>
    <main>
        {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
        <div class="flash-stack" aria-live="polite">
            {% for category, message in messages %}
            <div class="flash flash-{{ category }}">{{ message }}</div>
            {% endfor %}
        </div>
        {% endif %}
        {% endwith %}
        {% block content %}{% endblock %}
    </main>
</body>
</html>
