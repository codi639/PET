{% extends "base.html" %}
{% block title %}Sign in{% endblock %}
{% block content %}
<section class="auth-layout">
    <div class="auth-intro">
        <p class="eyebrow">PRIVATE ENCRYPTION TOOL</p>
        <h1>Your files.<br><em>Your keys.</em></h1>
    </div>
    <div class="form-panel">
        <div class="panel-kicker">Welcome back</div>
        <h2>Sign in to PET</h2>
        <p class="muted">Unlock your local workspace.</p>
        <form method="post" class="stack-form">
            <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
            <label>Username<input name="username" autocomplete="username" required autofocus></label>
            <label>Password<input name="password" type="password" autocomplete="current-password" required></label>
            <button class="button button-primary" type="submit">Open workspace <span>→</span></button>
        </form>
        <p class="form-footnote">New to this device? <a href="{{ url_for('register') }}">Create an identity</a></p>
    </div>
</section>
{% endblock %}
